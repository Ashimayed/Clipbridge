name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Decode signing key
        env:
          CLIPBRIDGE_KEYSTORE_BASE64: ${{ secrets.CLIPBRIDGE_KEYSTORE_BASE64 }}
        run: |
          echo "$CLIPBRIDGE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compute next release version
        id: ver
        run: |
          git fetch --tags --force
          last=$(git tag --list 'v0.*' | sed 's/^v0\.//' | sort -n | tail -1)
          last=${last:-1}
          next=$((last + 1))
          echo "tag=v0.$next" >> "$GITHUB_OUTPUT"
          echo "title=ClipBridge 0.$next" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          CLIPBRIDGE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          CLIPBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.CLIPBRIDGE_KEYSTORE_PASSWORD }}
          CLIPBRIDGE_KEY_ALIAS: ${{ secrets.CLIPBRIDGE_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK for distribution
        run: |
          mkdir -p app/build/outputs/apk/release/dist
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/dist/ClipBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClipBridge-apk
          path: android-app/app/build/outputs/apk/release/dist/ClipBridge.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.title }}
          body: |
            Automated build from commit ${{ github.sha }}.
            Download ClipBridge.apk below and install it on your Android phone.

            If you already have an older ClipBridge installed, you may need to uninstall it
            first if this build was signed with a different key than the one you have.
          files: android-app/app/build/outputs/apk/release/dist/ClipBridge.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
